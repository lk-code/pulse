[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

[program:dotnet]
command=/app/Pulse.Api
directory=/app
environment=ASPNETCORE_URLS="http://localhost:5000",DATA_PATH="/data",MUSIC_PATH="/media"
autostart=true
autorestart=true
stderr_logfile=/var/log/dotnet.log
stdout_logfile=/var/log/dotnet.log

[program:nginx]
command=nginx -c /etc/nginx/nginx.conf -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log
